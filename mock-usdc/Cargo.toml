[package]
name = "mock-usdc"
description = "Testnet-only USDC stand-in with a public faucet, used by the memo demo"
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/ahmardchain/memo"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
near-sdk = "5.30.0"
near-contract-standards = "5.30.0"

[profile.release]
codegen-units = 1
opt-level = "z"
lto = true
debug = false
panic = "abort"
overflow-checks = true
